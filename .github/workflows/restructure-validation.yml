name: Restructure validation
on:
  push:
    branches: [restructure/petromin-layout]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record Flutter version
        run: flutter --version
      - name: Install packages
        run: flutter pub get
      - name: Strict baseline analysis
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Generate temporary Android host
        if: ${{ !startsWith(github.event.head_commit.message, 'docs(') }}
        run: |
          flutter create --platforms=android --org com.rounder.app .
          git restore pubspec.yaml
          flutter pub get
      - name: Build debug APK
        if: ${{ !startsWith(github.event.head_commit.message, 'docs(') }}
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.event.head_commit.message, 'docs(') }}
        with:
          name: rounder-restructured-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
