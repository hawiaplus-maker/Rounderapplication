name: Restructure validation
on:
  push:
    branches: [restructure/petromin-layout]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record Flutter version
        run: flutter --version
      - name: Install packages
        run: flutter pub get
      - name: Strict baseline analysis
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
