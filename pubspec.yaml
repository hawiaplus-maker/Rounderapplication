name: rounder_application
description: Rounder resident application.
publish_to: none
version: 1.0.8+14
environment:
  sdk: ">=3.9.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.8
  flutter_svg: ^2.3.0
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  get_it: ^9.3.0
  url_launcher: ^6.3.1
  flutter_secure_storage: ^11.2.0
  pretty_dio_logger: ^1.4.0
  shared_preferences_android: ">=2.4.28 <2.5.0"
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  geolocator: ^13.0.0
  geocoding: ^5.0.1
  upgrader: ^13.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo512.png"
  remove_alpha_ios: true
  min_sdk_android: 24


flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
    - assets/svg/
    - assets/images/ali/
    - assets/images/auth/
    - assets/images/home/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
          weight: 400
        - asset: assets/fonts/Cairo.ttf
          weight: 500
        - asset: assets/fonts/Cairo.ttf
          weight: 600
        - asset: assets/fonts/Cairo.ttf
          weight: 700
        - asset: assets/fonts/Cairo.ttf
          weight: 800

